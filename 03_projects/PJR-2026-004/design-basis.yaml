# Design basis for PJR-2026-004 (mock-up project for the structural-layout DXF -> SAFE 22 workflow).
# Leave unknowns as null - never guess. Validate:  python 04_tools/design_basis/validate_design_basis.py <file>
project:
  code: PJR-2026-004 # AAA-YYYY-NNN
  name:
  description: Mock-up project for the structural-layout DXF to SAFE 22 workflow (Development Plan v2, M1-M4); 3F PT floor
  stage:              # e.g. FOR APPROVAL / SHOP DRAWING / PRELIMINARY PT DESIGN
  client:
  drawing_prefix:     # XX-STR  e.g. WH-STR
  revision:           # R00 / P01 / C01
  issue_date:         # DD-MMM-YYYY
  structure_types: [pt]   # steel | rc | pt | composite | timber | masonry | foundations | seismic (drawing labels 'PT SLAB', 'PT BEAM')
approval:
  status: DRAFT       # DRAFT | FOR_REVIEW | APPROVED
  prepared_by:
  checked_by:
  approved_by:        # authorised engineer (PE/RE) - required for APPROVED
  approved_date:
standards:            # one entry per Eurocode part actually used
  - {id: EN 1990, generation: null, edition: null, used_for: Basis of design}
national_annex:
  mode: UNRESOLVED    # NA | CEN_RECOMMENDED | UNRESOLVED
  country:
  references: []      # exact NA document references when mode = NA
  basis_note:         # required when mode = CEN_RECOMMENDED
regulatory: []
