design_assumptions:
  design_working_life_years:
  consequence_class:
  units: {length: m, section: mm, force: kN, stress: MPa, pressure: kN/m2}
materials: []         # {id, element, spec, status: confirmed|assumed|to_confirm, source}
loads: []             # {id, description, value, unit, status, source}
combinations: []      # {id, description, status, source}
analysis_provenance:  # software, version, model_file, model_hash, run_date, export_files[]
open_items:           # {id, status: open|closed, description}
  - {id: OI-01, status: open, description: "Project name, client, stage, drawing prefix, revision and issue date not given"}
  - {id: OI-02, status: open, description: "National Annex mode for this project (company-wide CEN recommended values confirmed 14-OCT-2026, gap G09; confirm it applies here)"}
  - {id: OI-03, status: open, description: "Materials, loads and combinations not given; needed for M2 (steps 3-6)"}
  - {id: OI-04, status: open, description: "3F Floor.dxf: two nested rectangles on Cam-PT Wall (16.15 x 11.65 m and 16.85 x 12.35 m) - one core wall about 350 mm thick, or something else?"}
