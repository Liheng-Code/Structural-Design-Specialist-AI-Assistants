sheet_003:
  general_notes:
    - "THESE NOTES SHALL BE READ WITH ALL ARCHITECTURAL, MEP, EQUIPMENT (STEAM BOILER) AND CLADDING SUPPLIER DRAWINGS. ANY DISCREPANCY SHALL BE REPORTED TO THE STRUCTURAL ENGINEER BEFORE WORK PROCEEDS."
    - "ALL DIMENSIONS ARE IN mm AND LEVELS IN m UNLESS NOTED. DO NOT SCALE FROM DRAWINGS. WRITTEN DIMENSIONS GOVERN."
    - "LEVEL +0.000 = FINISHED GROUND FLOOR LEVEL (FFL) OF THE WAREHOUSE. STEEL BASE PLATES SIT ON THE STUMP COLUMNS AT +0.000 (FFL); TOP OF BRICK WALL = +2.000. EAVE = +12.000. RIDGE = +12.656."
    - "THE STRUCTURE IS A SINGLE-SPAN STEEL PORTAL FRAME (15.0 m SPAN, 5 FRAMES AT 6.25 m = 25.0 m) ON RC STUMP COLUMNS (-0.500 TO +0.000), PILE CAPS AND PRECAST DRIVEN RC PILES 300x300x7000 (2 PCS PER CAP). ROOF SLOPE 5 deg."
    - "ROOF AND WALL ABOVE +2.000 = 40 mm PU SANDWICH PANEL. PERIMETER WALL = 200 mm BRICK + PLASTER BOTH SIDES, H = 2.0 m FROM FFL, STIFFENED BY C2 COLUMNS (200x200 @ 3125) + BOND BEAM BB1."
    - "THE BRICK WALL, GROUND BEAMS AND GROUND SLAB ARE NON-STRUCTURAL WITH RESPECT TO THE STEEL FRAME. THE STEEL FRAME ACTS ALONE FOR ALL ROOF AND WIND LOADS."
    - "THE CONTRACTOR SHALL VERIFY SITE LEVELS, SETBACKS AND BOUNDARY CLEARANCES (PCP1 PROJECTS 1.70 m FROM GRID A/B, PCP2 1.20 m FROM GRID 1/5) BEFORE EXCAVATION."
    - "TEMPORARY WORKS AND STABILITY OF THE PARTLY ERECTED STEELWORK ARE THE CONTRACTOR'S RESPONSIBILITY. TEMPORARY BRACING SHALL REMAIN UNTIL ROOF BRACING AND CLADDING ARE COMPLETE."
  actions_table:
