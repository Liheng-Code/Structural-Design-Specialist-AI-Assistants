# PT basis - 2F PT redraft example. STATUS: DRAFT, FOR REVIEW. Not approved; engineer sign-off is human.
# Values are the ones printed on the source notes (Success Design & Build, sheet 15, Rev 01, 22-AUG-2023) unless an open item says otherwise.
# Only the design codes were changed from BS to Eurocode. See open_items for every value that does not carry straight across.
