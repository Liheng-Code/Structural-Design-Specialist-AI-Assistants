open_items:
  - {id: PT-OI-01, status: open, description: "BS 6399 / BS 8110-1997 replaced by EN 1990 + EN 1991-1-1 / EN 1992-1-1 as instructed. Clause-level checks (EN 1992-1-1 5.10 prestressing, 4.4.1 cover) are NOT done by this note sheet."}
  - {id: PT-OI-02, status: open, description: "Source gives fcu = 37 MPa (cube, BS 8110). Class C30/37 (fck = 30, fck,cube = 37) taken from EN 1992-1-1 Table 3.1 as the equivalent class. Engineer to confirm the class."}
  - {id: PT-OI-03, status: open, description: "Strength at stressing left TBC. Source prints f'cui = 0.75 x f'cu = 28.75 MPa, but 0.75 x 37 = 27.75 MPa. Engineer decides the required value at stressing (fck,cube(t0))."}
  - {id: PT-OI-04, status: open, description: "RB 235 MPa round bars (dia < 10) are not covered by EN 10080 B500 reinforcement. Engineer to confirm the material or specify an EN equivalent."}
  - {id: PT-OI-05, status: open, description: "Source 'clear cover 25 mm' kept. Nominal cover must be set from the exposure class and bond requirement (EN 1992-1-1 4.4.1: cnom = cmin + delta cdev). Exposure class not given."}
  - {id: PT-OI-06, status: open, description: "Strand standard kept as ASTM A416 Grade 270 (source). Engineer to confirm acceptance under the approved PT supplier assessment, or specify an EN 10138-3 strand."}
  - {id: PT-OI-07, status: open, description: "Source 'yield strength 1670 MPa' (ASTM yield at 1 % extension). EN 1992-1-1 uses the 0.1 % proof stress fp0.1k; take it from the supplier / strand certificate. Not converted."}
  - {id: PT-OI-08, status: open, description: "Source wobble factor k = 0.003 /m is not converted. EN 1992-1-1 5.10.5.2 uses mu*(theta + k*x) with k in rad/m; the source formula is not stated. Take mu and k from the PT supplier assessment."}
  - {id: PT-OI-09, status: open, description: "Wedge draw-in 6.0 mm and duct H/W (25 mm / 55-80 mm) are supplier-specific. Confirm with the approved supplier."}
  - {id: PT-OI-10, status: open, description: "Loads (live, dead, wall) are blank on the source notes. The source plan states SDL = 250 KSM and LL = 500 KSM; units and values to be set from the design basis loads."}
  - {id: PT-OI-11, status: open, description: "Source rebar legends disagree: first legend shows 3RD LAYER = T2 and 4TH LAYER = T1; the slab-step detail shows 3RD = T1 and 4TH = T2. The slab-step order (3RD = T1, 4TH = T2) is used. Engineer to confirm."}
  - {id: PT-OI-12, status: open, description: "Symbol for 1 strand/tendon cannot be told apart from the 3-strand symbol in the supplied image. Left TBC. Symbols for 5 strands (diamond) and N strands (circle with N) read from the image."}
  - {id: PT-OI-13, status: open, description: "Jacking force 140 kN per strand is the source value. Compare with the EN 1992-1-1 5.10.2.1 limit once fp0.1k is known (see validate_pt_basis output)."}
